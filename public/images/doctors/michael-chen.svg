<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece1"/>
      <stop offset="100%" stop-color="#e3d7c3"/>
    </linearGradient>
    <linearGradient id="mc-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#556b4f"/>
      <stop offset="100%" stop-color="#3d4f38"/>
    </linearGradient>
    <linearGradient id="skin-michael" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6dcc4"/>
      <stop offset="100%" stop-color="#e2bf9f"/>
    </linearGradient>
    <linearGradient id="hair-michael" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2b2a"/>
      <stop offset="100%" stop-color="#191817"/>
    </linearGradient>
  </defs>

  <!-- Background / Serene Treatment Room -->
  <rect width="800" height="500" fill="url(#mc-bg)"/>

  <!-- Treatment Bed & Linen in Background -->
  <rect x="0" y="280" width="300" height="220" rx="10" fill="#ded7ca"/>
  <ellipse cx="140" cy="270" rx="70" ry="25" fill="#ebe4d8"/>
  
  <!-- Warm lamp glow (Left) -->
  <ellipse cx="180" cy="140" rx="80" ry="80" fill="#fff9ee" opacity="0.4"/>
  <rect x="175" y="160" width="10" height="120" fill="#c8bca9"/>
  <path d="M150 160l30-40 30 40z" fill="#ded5c4"/>

  <!-- Potted plant on side (Right) -->
  <circle cx="720" cy="240" r="50" fill="#7a9a7b" opacity="0.7"/>
  <circle cx="750" cy="220" r="40" fill="#628264" opacity="0.8"/>
  <rect x="710" y="270" width="40" height="50" rx="6" fill="#ded6c8"/>

  <!-- Practitioner Silhouette / Olive Shirt -->
  <g id="body-michael">
    <!-- Olive Button-down Shirt -->
    <path d="M210 500c12-95 50-165 120-190l70 65 70-65c70 25 108 95 120 190z" fill="url(#mc-shirt)"/>
    <!-- Collar & Placket -->
    <path d="M330 310l45 40 25-15 25 15 45-40-30-20-40 20-40-20z" fill="#44563e"/>
    <line x1="400" y1="350" x2="400" y2="500" stroke="#2f3d2b" stroke-width="3"/>
    <!-- Shirt Buttons -->
    <circle cx="400" cy="380" r="4" fill="#a4b39e"/>
    <circle cx="400" cy="425" r="4" fill="#a4b39e"/>
    <circle cx="400" cy="470" r="4" fill="#a4b39e"/>
  </g>

  <!-- Neck -->
  <rect x="365" y="235" width="70" height="85" rx="14" fill="url(#skin-michael)"/>
  <path d="M365 285c25 12 45 12 70 0" stroke="#cd9d78" stroke-width="3" fill="none"/>

  <!-- Face -->
  <g id="head-michael">
    <ellipse cx="400" cy="195" rx="72" ry="90" fill="url(#skin-michael)"/>

    <!-- Short neat dark hair -->
    <path d="M325 180c-5-75 40-115 75-115s80 40 75 115c-20-30-50-40-75-40s-55 10-75 40z" fill="url(#hair-michael)"/>

    <!-- Eyebrows -->
    <path d="M348 158c14-6 28-4 34 2" stroke="#191817" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M418 160c6-6 20-8 34-2" stroke="#191817" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Warm Smiling Eyes -->
    <path d="M352 176c8-5 20-5 28 2" stroke="#191817" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M420 178c8-7 20-7 28-2" stroke="#191817" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <path d="M396 182c0 14 3 20 8 22" stroke="#cd9d78" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Gentle Friendly Smile -->
    <path d="M372 228c14 14 42 14 56 0" stroke="#b05c50" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M376 228c11 10 35 10 48 0" fill="#ffffff"/>
  </g>
</svg>
