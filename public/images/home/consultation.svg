<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" role="img" aria-label="Placeholder: doctor reviewing results with a patient">
  <defs>
    <linearGradient id="cs-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#e9e3d6"/>
