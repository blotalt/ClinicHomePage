    <linearGradient id="cs-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7ebe6"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="950" fill="url(#cs-wall)"/>

  <!-- framed art -->
