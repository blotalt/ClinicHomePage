    <ellipse cx="390" cy="185" rx="26" ry="46"/>
    <ellipse cx="762" cy="178" rx="27" ry="48"/>
  </g>

  <!-- plants -->
  <path d="M556 400c-46-84-22-186 30-228 46 48 60 154 20 228z" fill="#83a98a"/>
  <rect x="536" y="396" width="86" height="80" rx="16" fill="#c9bda8"/>
  <path d="M900 430c-34-64-16-142 20-174 34 38 44 116 14 174z" fill="#96b79b"/>
  <rect x="884" y="426" width="70" height="68" rx="14" fill="#cfc3ad"/>

  <!-- table -->
  <rect x="60" y="640" width="980" height="26" rx="10" fill="#d9c8a8"/>
  <rect x="120" y="666" width="20" height="200" rx="9" fill="#c3ae8a"/>
  <rect x="950" y="666" width="20" height="200" rx="9" fill="#c3ae8a"/>
  <rect x="60" y="628" width="980" height="16" rx="8" fill="#e6d9bd"/>

