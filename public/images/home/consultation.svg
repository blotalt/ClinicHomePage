    <path d="M262 466q38 44 76 0" stroke="#dfe4e0" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M268 470v70q32 34 64 0v-70" stroke="#9fb4b8" stroke-width="13" fill="none"/>
    <rect x="286" y="536" width="30" height="22" rx="7" fill="#8ea7ac"/>
    <rect x="238" y="556" width="66" height="26" rx="9" fill="#f2f5f1"/>
