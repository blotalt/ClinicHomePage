<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Placeholder: sunlit clinic lounge">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f4"/><stop offset="1" stop-color="#e4ece6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#d6e8e0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e0d1"/><stop offset="1" stop-color="#dbd0be"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="620" width="1600" height="280" fill="url(#floor)"/>

  <!-- window wall -->
  <rect x="1120" y="40" width="440" height="600" rx="10" fill="url(#glass)"/>
  <g fill="none" stroke="#ffffff" stroke-width="10" opacity=".9">
    <path d="M1340 40v600M1120 320h440"/>
  </g>
  <rect x="1090" y="30" width="26" height="620" rx="8" fill="#f7faf8"/>

  <!-- curtain -->
  <rect x="1010" y="30" width="90" height="620" rx="18" fill="#f1f3ee" opacity=".95"/>

  <!-- framed botanical art -->
  <g fill="#fbfcfa" stroke="#dfe6df" stroke-width="4">
    <rect x="470" y="150" width="120" height="150" rx="6"/>
    <rect x="620" y="120" width="110" height="140" rx="6"/>
    <rect x="620" y="290" width="110" height="130" rx="6"/>
    <rect x="760" y="170" width="130" height="160" rx="6"/>
  </g>
  <g fill="#a8c3ac" opacity=".75">
    <ellipse cx="530" cy="225" rx="26" ry="46"/>
    <ellipse cx="675" cy="190" rx="24" ry="42"/>
    <ellipse cx="675" cy="355" rx="24" ry="40"/>
    <ellipse cx="825" cy="250" rx="28" ry="48"/>
  </g>

  <!-- sofa -->
  <rect x="820" y="430" width="360" height="130" rx="26" fill="#dfe7e1"/>
  <rect x="800" y="470" width="400" height="110" rx="28" fill="#cfdcd4"/>
  <rect x="855" y="452" width="130" height="46" rx="16" fill="#eef2ee"/>
  <rect x="1000" y="452" width="130" height="46" rx="16" fill="#eef2ee"/>
  <path d="M1050 500q60 10 96 54" stroke="#bcd6da" stroke-width="26" fill="none" stroke-linecap="round"/>
  <g fill="#b9c7bd"><rect x="828" y="560" width="18" height="42" rx="8"/><rect x="1152" y="560" width="18" height="42" rx="8"/></g>

  <!-- plants -->
  <g>
    <path d="M1258 560c-34-70-14-150 26-186 34 40 44 122 12 186z" fill="#8fb094"/>
    <rect x="1246" y="556" width="72" height="70" rx="14" fill="#cfc2ac"/>
  </g>
  <g>
    <path d="M1390 580c-40-56-30-136 8-172 40 40 52 116 22 172z" fill="#7ba384"/>
    <rect x="1372" y="576" width="80" height="76" rx="16" fill="#c9bda8"/>
  </g>
  <g>
    <path d="M1490 596c-24-46-10-102 18-128 26 30 32 88 10 128z" fill="#9dbb9f"/>
    <rect x="1478" y="592" width="60" height="60" rx="12" fill="#d3c8b4"/>
  </g>

  <!-- low table -->
  <ellipse cx="1230" cy="700" rx="150" ry="34" fill="#c9b898"/>
  <ellipse cx="1230" cy="690" rx="150" ry="34" fill="#d8c8a9"/>
  <rect x="1170" y="712" width="12" height="60" rx="6" fill="#bda98a"/>
  <rect x="1284" y="712" width="12" height="60" rx="6" fill="#bda98a"/>

  <rect width="1600" height="900" fill="url(#beam)"/>
</svg>
