<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Placeholder: map of the clinic location">
  <defs>
    <linearGradient id="mp-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4e8"/><stop offset="1" stop-color="#e2ebdc"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#mp-land)"/>

  <!-- park blocks -->
  <rect x="40" y="60" width="180" height="150" rx="14" fill="#d4e5cd"/>
  <rect x="640" y="300" width="220" height="170" rx="14" fill="#d4e5cd"/>
  <rect x="300" y="380" width="150" height="110" rx="12" fill="#d8e7d1"/>

  <!-- river -->
  <path d="M760 0c-40 120 30 220-10 330-26 72-8 130 30 190h120V0z" fill="#cfe2ec"/>
  <path d="M742 0c-44 126 26 226-14 336-24 66-6 122 28 184" stroke="#bcd7e4" stroke-width="10" fill="none"/>

  <!-- roads -->
  <g stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M0 250h700M0 130h620M0 380h640"/>
    <path d="M250 0v520M470 0v520M120 0v520M600 0v520"/>
  </g>
  <g stroke="#f4f7f2" stroke-width="6" fill="none">
    <path d="M0 310h660M360 0v520"/>
  </g>

  <!-- bridge -->
  <g stroke="#c9cfc6" stroke-width="8" fill="none">
    <path d="M700 250h150M700 130h130"/>
  </g>

  <!-- building blocks -->
  <g fill="#e6e9e2">
    <rect x="150" y="280" width="60" height="46" rx="6"/>
    <rect x="290" y="160" width="52" height="40" rx="6"/>
    <rect x="520" y="300" width="56" height="44" rx="6"/>
    <rect x="150" y="430" width="70" height="40" rx="6"/>
  </g>

  <!-- trees -->
  <g fill="#a9c9a4">
    <circle cx="90" cy="120" r="14"/><circle cx="140" cy="160" r="11"/>
    <circle cx="700" cy="360" r="13"/><circle cx="760" cy="410" r="10"/>
    <circle cx="340" cy="430" r="12"/><circle cx="400" cy="455" r="9"/>
  </g>

  <!-- clinic marker -->
  <circle cx="470" cy="250" r="34" fill="#1b5a39"/>
  <path d="M470 236c-9 6-13 15-13 22 8 0 17-5 21-12 4-8 1-8-8-10z" fill="#ffffff"/>
  <path d="M470 236c9 6 13 15 13 22-8 0-17-5-21-12-4-8-1-8 8-10z" fill="#ffffff" opacity=".75"/>
  <circle cx="470" cy="250" r="44" fill="none" stroke="#1b5a39" stroke-opacity=".22" stroke-width="8"/>

  <!-- scale bar -->
  <g>
    <rect x="40" y="470" width="90" height="5" rx="2" fill="#8d9a89"/>
    <text x="40" y="464" font-family="sans-serif" font-size="13" fill="#6d7a69">500 ft</text>
  </g>
</svg>
