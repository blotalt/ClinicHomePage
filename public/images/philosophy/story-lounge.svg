<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3ec"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>
    <linearGradient id="window-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2eff1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sofa-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#e8e2d5"/>
    </linearGradient>
    <linearGradient id="wood-table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="50%" stop-color="#e2c699"/>
      <stop offset="100%" stop-color="#c6a370"/>
    </linearGradient>
    <linearGradient id="plant-leaf-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#729b79"/>
      <stop offset="100%" stop-color="#477650"/>
    </linearGradient>
    <linearGradient id="plant-leaf-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bb192"/>
      <stop offset="100%" stop-color="#55855e"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="1200" height="900" fill="url(#wall-grad)"/>

  <!-- Warm Wooden Floor -->
  <rect y="580" width="1200" height="320" fill="#d9cebf"/>
  <!-- Floor Planks -->
  <path d="M0 640h1200M0 700h1200M0 760h1200M0 820h1200" stroke="#cdbeab" stroke-width="2" opacity="0.6"/>

  <!-- Large Sunny Windows (Left) -->
  <rect x="60" y="40" width="340" height="520" rx="12" fill="url(#window-light)"/>
  <rect x="75" y="55" width="145" height="235" rx="6" fill="#f4fafb" opacity="0.8"/>
  <rect x="235" y="55" width="150" height="235" rx="6" fill="#f4fafb" opacity="0.8"/>
  <rect x="75" y="305" width="145" height="240" rx="6" fill="#f4fafb" opacity="0.8"/>
  <rect x="235" y="305" width="150" height="240" rx="6" fill="#f4fafb" opacity="0.8"/>
  <!-- Window Frames -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <line x1="227" y1="40" x2="227" y2="560"/>
    <line x1="60" y1="297" x2="400" y2="297"/>
    <rect x="60" y="40" width="340" height="520" rx="12" fill="none" stroke-width="12"/>
  </g>

  <!-- Sunbeam overlay -->
  <polygon points="120,40 400,40 780,720 300,720" fill="#ffffff" opacity="0.25"/>

  <!-- Botanical Art on Wall -->
  <rect x="880" y="100" width="160" height="220" rx="10" fill="#fdfbf7" stroke="#e0d6c5" stroke-width="4"/>
  <circle cx="960" cy="180" r="45" fill="#e8f0eb"/>
  <path d="M960 215c-15-25-5-55 15-70-5 25-20 50-15 70z" fill="#7fa587"/>
  <path d="M960 215c15-25 5-55-15-70 5 25 20 50 15 70z" fill="#588562"/>

  <!-- Bookshelf / Console Table (Right) -->
  <rect x="780" y="240" width="16" height="340" rx="4" fill="#cbb79a"/>
  <rect x="1100" y="240" width="16" height="340" rx="4" fill="#cbb79a"/>
  <rect x="760" y="280" width="370" height="14" rx="4" fill="#decab1"/>
  <rect x="760" y="380" width="370" height="14" rx="4" fill="#decab1"/>
  <rect x="760" y="480" width="370" height="14" rx="4" fill="#decab1"/>
  
  <!-- Books and pottery on shelf -->
  <rect x="790" y="250" width="18" height="30" rx="2" fill="#7a9a85"/>
  <rect x="812" y="242" width="22" height="38" rx="2" fill="#d98a6c"/>
  <rect x="838" y="255" width="16" height="25" rx="2" fill="#9dbbcf"/>
  <ellipse cx="940" cy="265" rx="20" ry="15" fill="#f0ebe1" stroke="#d5cbbe" stroke-width="3"/>
  <ellipse cx="1040" cy="260" rx="16" ry="20" fill="#e4d2be"/>

  <!-- Jute Textured Area Rug -->
  <ellipse cx="640" cy="740" rx="480" ry="120" fill="#cfc2ad" stroke="#c0b19b" stroke-width="6"/>
  <ellipse cx="640" cy="740" rx="430" ry="105" fill="#dad0be" opacity="0.7"/>

  <!-- Comfortable Large Sectional Sofa -->
  <g id="main-sofa">
    <!-- Backrest -->
    <rect x="180" y="420" width="460" height="150" rx="28" fill="#e2ded4"/>
    <rect x="200" y="435" width="200" height="120" rx="20" fill="url(#sofa-cream)"/>
    <rect x="420" y="435" width="200" height="120" rx="20" fill="url(#sofa-cream)"/>
    <!-- Seat Cushions -->
    <rect x="160" y="520" width="490" height="120" rx="26" fill="url(#sofa-cream)"/>
    <!-- Armrest -->
    <rect x="130" y="480" width="65" height="150" rx="24" fill="#ded7cb"/>
    <!-- Cozy Throw Pillows -->
    <rect x="200" y="470" width="75" height="75" rx="16" fill="#a4beaa" transform="rotate(-8 237 507)"/>
    <rect x="540" y="475" width="70" height="70" rx="16" fill="#d9af94" transform="rotate(6 575 510)"/>
  </g>

  <!-- Accent Armchair (Right) -->
  <g id="armchair">
    <rect x="940" y="460" width="180" height="140" rx="24" fill="#dfdad0"/>
    <rect x="925" y="530" width="195" height="100" rx="22" fill="url(#sofa-cream)"/>
    <rect x="910" y="490" width="50" height="130" rx="20" fill="#d5cec1"/>
  </g>

  <!-- Solid Oak Coffee Table (Center) -->
  <g id="coffee-table">
    <!-- Table Legs -->
    <rect x="520" y="650" width="20" height="70" rx="6" fill="#aa8d65"/>
    <rect x="740" y="650" width="20" height="70" rx="6" fill="#aa8d65"/>
    <!-- Table Top -->
    <rect x="480" y="620" width="320" height="40" rx="12" fill="url(#wood-table)"/>
    <!-- Table Items: Ceramic Vase, Botanical Book, Cup -->
    <rect x="530" y="605" width="60" height="16" rx="3" fill="#f8f5ee" stroke="#ded8cb" stroke-width="2"/>
    <ellipse cx="640" cy="590" rx="18" ry="30" fill="#f4efe6" stroke="#dbd2c2" stroke-width="2"/>
    <path d="M638 560c-8-25 12-40 2-60" stroke="#7fa587" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="710" cy="610" r="10" fill="#e8dfd1"/>
  </g>

  <!-- Lush Indoor Houseplants (Monstera & Fiddle Leaf) -->
  <!-- Left Plant near window -->
  <g id="window-plant">
    <!-- Pot -->
    <path d="M370 540l15 90h60l15-90z" fill="#f5ede0" stroke="#ded4c3" stroke-width="3"/>
    <!-- Leaves -->
    <path d="M415 540c-40-60-20-130 30-160 30 35 40 110 10 160z" fill="url(#plant-leaf-1)"/>
    <path d="M390 540c-60-40-70-110-30-150 40 25 65 95 30 150z" fill="url(#plant-leaf-2)"/>
    <path d="M440 540c30-50 70-80 100-70-10 40-40 85-100 70z" fill="url(#plant-leaf-1)"/>
  </g>

  <!-- Right Plant near corner -->
  <g id="corner-plant">
    <path d="M720 500l12 70h50l12-70z" fill="#ece5d8" stroke="#d5cbbe" stroke-width="3"/>
    <path d="M755 500c-25-45-15-95 20-120 20 25 30 80 10 120z" fill="url(#plant-leaf-2)"/>
    <path d="M740 500c-40-30-50-80-20-110 30 20 50 70 20 110z" fill="url(#plant-leaf-1)"/>
  </g>
</svg>
