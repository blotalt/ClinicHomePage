<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Placeholder: clinic reception lounge">
  <defs>
    <linearGradient id="pl-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2e9"/><stop offset="1" stop-color="#e8e1d2"/>
    </linearGradient>
    <linearGradient id="pl-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ee"/><stop offset="1" stop-color="#b9d6c0"/>
    </linearGradient>
    <linearGradient id="pl-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcd6ca"/><stop offset="1" stop-color="#cbc4b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#pl-wall)"/>
  <rect y="620" width="1200" height="280" fill="url(#pl-floor)"/>

  <!-- window wall, left -->
  <rect x="20" y="60" width="300" height="560" rx="8" fill="url(#pl-glass)"/>
  <g stroke="#fbfaf6" stroke-width="12" fill="none"><path d="M170 60v560M20 330h300"/></g>

  <!-- slatted timber screen, right -->
  <g fill="#d9c19a">
    <rect x="1010" y="150" width="16" height="430" rx="6"/>
    <rect x="1044" y="150" width="16" height="430" rx="6"/>
    <rect x="1078" y="150" width="16" height="430" rx="6"/>
    <rect x="1112" y="150" width="16" height="430" rx="6"/>
  </g>

  <!-- wall sign -->
  <rect x="700" y="250" width="230" height="70" rx="6" fill="#efe9dd"/>
  <rect x="726" y="272" width="150" height="12" rx="5" fill="#b3a88f"/>
  <rect x="762" y="294" width="78" height="7" rx="3" fill="#c6bda6"/>

  <!-- shelf -->
  <rect x="700" y="170" width="230" height="10" rx="4" fill="#d9cdb4"/>
  <g fill="#9dbb9f"><rect x="716" y="132" width="16" height="38" rx="5"/><rect x="740" y="122" width="18" height="48" rx="5"/><rect x="766" y="140" width="14" height="30" rx="5"/></g>

  <!-- sofa, left -->
  <rect x="150" y="470" width="270" height="120" rx="24" fill="#e6e1d5"/>
  <rect x="132" y="510" width="300" height="100" rx="26" fill="#d5cec0"/>
  <rect x="176" y="492" width="110" height="42" rx="14" fill="#f1ede3"/>

  <!-- armchairs, centre -->
  <g>
    <rect x="500" y="470" width="150" height="130" rx="22" fill="#e9e4d8"/>
    <rect x="490" y="516" width="170" height="94" rx="24" fill="#dad3c4"/>
  </g>
  <g>
    <rect x="700" y="470" width="150" height="130" rx="22" fill="#e9e4d8"/>
    <rect x="690" y="516" width="170" height="94" rx="24" fill="#dad3c4"/>
  </g>

  <!-- round coffee table -->
  <ellipse cx="520" cy="690" rx="140" ry="34" fill="#c6ad84"/>
  <ellipse cx="520" cy="678" rx="140" ry="34" fill="#dcc79f"/>
  <rect x="470" y="700" width="12" height="58" rx="6" fill="#bda98a"/>
  <rect x="560" y="700" width="12" height="58" rx="6" fill="#bda98a"/>
  <circle cx="486" cy="672" r="14" fill="#f2efe7"/>
  <circle cx="520" cy="668" r="12" fill="#eef2ee"/>
  <rect x="540" y="662" width="52" height="14" rx="5" fill="#e8e3d6"/>

  <!-- rug -->
  <ellipse cx="560" cy="790" rx="380" ry="70" fill="#e6e0d2" opacity=".7"/>

  <!-- plants -->
  <g>
    <path d="M372 470c-44-80-20-176 28-216 44 46 58 146 22 216z" fill="#7fa587"/>
    <rect x="352" y="466" width="82" height="78" rx="16" fill="#e9e3d5"/>
  </g>
  <g>
    <path d="M906 486c-34-64-16-140 20-172 34 38 44 114 14 172z" fill="#93b498"/>
    <rect x="890" y="482" width="70" height="68" rx="14" fill="#efe9db"/>
  </g>
  <g>
    <path d="M636 452c-28-52-12-114 16-142 28 32 36 98 12 142z" fill="#8db292"/>
    <rect x="622" y="448" width="62" height="60" rx="12" fill="#e6dfd0"/>
  </g>
</svg>
